[pytest]
markers =
    regression
    smoke
    search
    notifications
    working
    post
    comment
    like
    flaky
    registration
    feed
    messages
    login
    register
    moderation
    admin
    auth
    follow
    bookmarks
    upload
    positive
    negative
testpaths = tests
pythonpath=.
addopts=
    --strict-markers
    -sv
    -W ignore
    --alluredir=allure-results
    --clean-alluredir