[pytest]
markers =
    regression
    smoke
    search
    notifications
    working
    post
    comment
    like
    flaky
    registration
    feed
    messages
    login
    register
    moderation
    search
testpaths = tests
pythonpath=.
addopts=
    -p no:warnings
    -sv
    -W ignore
    --alluredir=allure-results
    --clean-alluredir