[pytest]
markers =
    regression:
    smoke: Most critical tests
    search: Search service
    notifications: Notification service
    working: currently in debug
    post: Post service
    comment: Comment service
    like:
    flaky
    registration
    feed
    messages
    login
    register
    moderation
testpaths = tests
pythonpath=.
addopts=
    -p no:warnings
    -sv
    -W ignore
    --alluredir=allure-results
    --clean-alluredir